<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Vibrant Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>

    <!-- Glowing Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="340" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="340" fill="url(#grid)" rx="16" />

  <!-- Animated Dynamic Background Elements -->
  <g opacity="0.25">
    <circle cx="150" cy="80" r="40" fill="#38bdf8">
      <animate attributeName="r" values="35;45;35" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="4s" repeatCount="indefinite" />
    </circle>
    
    <circle cx="1050" cy="260" r="60" fill="#818cf8">
      <animate attributeName="r" values="50;65;50" dur="6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.15;0.4;0.15" dur="6s" repeatCount="indefinite" />
    </circle>

    <path d="M 100 280 Q 300 320 600 280 T 1100 100" fill="none" stroke="url(#titleGrad)" stroke-width="2" stroke-dasharray="8 8">
      <animate attributeName="stroke-dashoffset" values="100;0" dur="8s" repeatCount="indefinite" opacity="0.6"/>
    </path>

    <path d="M 50 120 Q 400 40 800 120 T 1150 220" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" values="0;100" dur="10s" repeatCount="indefinite" opacity="0.5"/>
    </path>
  </g>

  <!-- Foreground Content Container -->
  <g text-anchor="middle">
    <!-- Top Pill Tag -->
    <g transform="translate(600, 52)">
      <rect x="-140" y="-18" width="280" height="34" rx="17" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
      <text y="4" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="2">COMMERCE ARCHITECTURE</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="132" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" filter="url(#glow)">
      Awesome Omnichannel Retail Commerce
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="600" y="178" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" letter-spacing="0.3">
      Curated Enterprise SaaS Platforms &amp; Open-Source Engines for Modern Unified Commerce
    </text>

    <!-- Feature Badges Flow Row -->
    <g transform="translate(600, 240)">
      <g transform="translate(-320, 0)">
        <rect x="-80" y="-18" width="160" height="36" rx="8" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1.5"/>
        <text y="5" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ MACH &amp; Headless</text>
      </g>

      <g transform="translate(-110, 0)">
        <rect x="-75" y="-18" width="150" height="36" rx="8" fill="rgba(129, 140, 248, 0.12)" stroke="#818cf8" stroke-width="1.5"/>
        <text y="5" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🏬 Unified POS</text>
      </g>

      <g transform="translate(100, 0)">
        <rect x="-80" y="-18" width="160" height="36" rx="8" fill="rgba(192, 132, 252, 0.12)" stroke="#c084fc" stroke-width="1.5"/>
        <text y="5" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">📦 Real-time OMS</text>
      </g>

      <g transform="translate(310, 0)">
        <rect x="-80" y="-18" width="160" height="36" rx="8" fill="rgba(244, 63, 94, 0.12)" stroke="#f43f5e" stroke-width="1.5"/>
        <text y="5" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🔓 Open-Source &amp; SaaS</text>
      </g>
    </g>

    <!-- Footer Stats / Subtext -->
    <text x="600" y="304" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
      🚀 Headless APIs • B2B &amp; DTC • Multi-Storefront • Click &amp; Collect • Inventory Orchestration
    </text>
  </g>
</svg>
